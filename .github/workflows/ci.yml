name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build and test
        run: swift test
      - name: Build for iOS
        run: |
          # Xcode names the package scheme differently across versions, so pick it from the list.
          SCHEMES=$(xcodebuild -list -json | python3 -c 'import json, sys; print("\n".join(json.load(sys.stdin)["workspace"]["schemes"]))')
          echo "Schemes: $SCHEMES"
          SCHEME=$(echo "$SCHEMES" | grep -x -m1 -e Merging -e swift-merging-Package -e swift-merging || echo "$SCHEMES" | head -1)
          xcodebuild build -scheme "$SCHEME" -destination 'generic/platform=iOS Simulator' -skipMacroValidation -quiet

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest supported Swift, for Swift Testing and typed throws, and the current one.
        swift: ["6.0", "6.1"]
    container: swift:${{ matrix.swift }}-noble
    steps:
      - uses: actions/checkout@v5
      - name: Build and test
        run: swift test
